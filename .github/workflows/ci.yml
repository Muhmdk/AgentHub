name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTHUB_DATABASE_URL: postgresql+psycopg://agenthub:agenthub@127.0.0.1:5432/agenthub

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agenthub
          POSTGRES_USER: agenthub
          POSTGRES_PASSWORD: agenthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthub -d agenthub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: make setup

      - name: Lint and format check
        run: make lint

      - name: Static type check
        run: make typecheck

      - name: Migrate empty database
        run: make migrate

      - name: Test with coverage
        run: make test

      - name: Scan repository and dependencies
        run: make security

      - name: Start API and verify readiness
        shell: bash
        run: |
          make run >agenthub-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat agenthub-api.log
          exit 1
