name: PR CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        run: make setup
      - name: Check formatting and lint
        run: make lint
      - name: Check types
        run: make typecheck
      - name: Scan tracked files and dependencies
        run: make security

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTHUB_DATABASE_URL: postgresql+psycopg://agenthub:agenthub@127.0.0.1:5432/agenthub
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: agenthub
          POSTGRES_USER: agenthub
          POSTGRES_PASSWORD: agenthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthub -d agenthub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        run: make setup
      - name: Migrate empty database
        run: make migrate
      - name: Run unit tests
        run: make test-unit
      - name: Run contract tests
        run: make test-contract
      - name: Run integration tests
        run: make test-integration
      - name: Run selected end-to-end tests
        run: make test-e2e

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image once
        run: docker build --build-arg SOURCE_SHA="${GITHUB_SHA}" --tag agenthub:ci .
      - name: Verify non-root runtime
        run: test "$(docker image inspect agenthub:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Verify container liveness
        run: |
          docker run --detach --name agenthub-ci --publish 8000:8000 agenthub:ci
          trap 'docker logs agenthub-ci; docker rm --force agenthub-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/live; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  quality:
    name: Quality
    if: always()
    needs: [static, tests, container]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required checks
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$TEST_RESULT" = success
          test "$CONTAINER_RESULT" = success
