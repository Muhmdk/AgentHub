name: Infrastructure Validation

on:
  pull_request:
    paths:
      - Dockerfile
      - compose.yaml
      - infra/**
      - deploy/helm/**
      - scripts/validate_kubernetes_security.py
      - tests/fixtures/helm/**
      - Makefile
      - migrations/**
      - .github/workflows/infrastructure.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTHUB_DATABASE_URL: postgresql+psycopg://agenthub:agenthub@127.0.0.1:5432/agenthub # pragma: allowlist secret
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: agenthub
          POSTGRES_USER: agenthub
          POSTGRES_PASSWORD: agenthub # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthub -d agenthub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        run: make setup
      - name: Install checksum-verified infrastructure CLIs
        env:
          TERRAFORM_VERSION: 1.16.2
          TERRAFORM_SHA256: 0d17011f0c4664539b164b044903d04e296c86c13cb9f28040076c65cfb3985a # pragma: allowlist secret
          HELM_VERSION: 4.2.4
          HELM_SHA256: c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3 # pragma: allowlist secret
          KUBECONFORM_VERSION: 0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883 # pragma: allowlist secret
        run: |
          install_dir="${RUNNER_TEMP}/agenthub-infra-bin"
          mkdir -p "$install_dir"

          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  ${RUNNER_TEMP}/terraform.zip" | sha256sum --check
          unzip -q "${RUNNER_TEMP}/terraform.zip" -d "$install_dir"

          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/helm.tar.gz" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/helm.tar.gz" -C "${RUNNER_TEMP}"
          mv "${RUNNER_TEMP}/linux-amd64/helm" "$install_dir/helm"

          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${RUNNER_TEMP}/kubeconform.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/kubeconform.tar.gz" -C "$install_dir" kubeconform

          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Validate Terraform modules and environment
        run: make infra-terraform
      - name: Lint and validate Helm and Kubernetes manifests
        run: make infra-helm
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Validate observability configuration
        run: |
          for dashboard in infra/observability/grafana/dashboards/*.json; do
            .venv/bin/python -m json.tool "$dashboard" >/dev/null
          done
          docker compose run --rm --no-deps --entrypoint promtool prometheus \
            check config /etc/prometheus/prometheus.yml
          docker compose run --rm --no-deps --entrypoint promtool prometheus \
            test rules /etc/prometheus/alerts.test.yml
      - name: Validate migrations from an empty database
        run: |
          make migrate
          test "$(.venv/bin/alembic current | awk '{print $1}')" = 0006_canary_rollouts
      - name: Build deployable image
        run: docker build --build-arg SOURCE_SHA="${GITHUB_SHA}" --tag agenthub:infra .
