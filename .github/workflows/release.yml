name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_version:
        description: AgentHub semantic version
        required: true
      agent:
        description: Candidate agent name
        default: inventory-agent
        required: true
      agent_version:
        description: Candidate agent semantic version
        default: 1.0.0
        required: true
      candidate_profile:
        description: Deterministic evaluation profile
        type: choice
        options: [default, regressed]
        default: default
        required: true
      promote_production:
        description: Request protected production promotion
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_version || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build, scan, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve immutable build identity
        id: identity
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${REQUESTED_VERSION:-${RELEASE_TAG#v}}"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Derive OCI metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/muhmdk/agenthub
          tags: |
            type=raw,value=${{ steps.identity.outputs.version }}
            type=sha,format=long
      - name: Build and publish once
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            SOURCE_SHA=${{ github.sha }}
            VERSION=${{ steps.identity.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Fail on high or critical image findings
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/muhmdk/agenthub@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/muhmdk/agenthub@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: agenthub-sbom.cdx.json
          scanners: vuln
      - name: Create machine-readable build provenance
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          jq -n \
            --arg source_repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --arg source_sha "$GITHUB_SHA" \
            --arg image_reference "ghcr.io/muhmdk/agenthub@${IMAGE_DIGEST}" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg version "$VERSION" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{schema_version: "agenthub.dev/build-provenance/v1", source_repository: $source_repository, source_sha: $source_sha, image_reference: $image_reference, image_digest: $image_digest, version: $version, workflow_run: $workflow_run}' \
            > build-provenance.json
      - name: Attest build provenance with GitHub OIDC
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/muhmdk/agenthub
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest SBOM with GitHub OIDC
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/muhmdk/agenthub
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: agenthub-sbom.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-evidence-${{ github.run_id }}
          path: |
            agenthub-sbom.cdx.json
            build-provenance.json
          if-no-files-found: error
          retention-days: 90

  evaluation:
    name: Candidate gate
    needs: build
    uses: ./.github/workflows/candidate-evaluation.yml
    with:
      agent: ${{ inputs.agent || 'inventory-agent' }}
      version: ${{ inputs.agent_version || '1.0.0' }}
      candidate_profile: ${{ inputs.candidate_profile || 'default' }}
      source_sha: ${{ github.sha }}
      image_digest: ${{ needs.build.outputs.image_digest }}

  provenance:
    name: Assemble release evidence
    needs: [build, evaluation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-evidence-${{ github.run_id }}
          path: evidence/build
      - name: Download candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-evidence-${{ github.run_id }}
          path: evidence/candidate
      - name: Assemble provenance and notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          jq -s \
            '.[0] * {release: .[1].release, evaluation_artifact_hash: .[1].release.provenance.evaluation_artifact_hash}' \
            evidence/build/build-provenance.json \
            evidence/candidate/candidate-release.json > release-provenance.json
          jq -r \
            '"# AgentHub " + $version + "\n\n- Source: `" + .source_sha + "`\n- Image: `" + .image_reference + "`\n- Candidate release: `" + .release.id + "`\n- Provenance: `" + .release.provenance_hash + "`\n- Evaluation: `" + .evaluation_artifact_hash + "`"' \
            --arg version "$VERSION" release-provenance.json > release-notes.md
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.run_id }}
          path: |
            release-provenance.json
            release-notes.md
          if-no-files-found: error
          retention-days: 90

  staging:
    name: Promote immutable digest to staging
    needs: [build, evaluation, provenance]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence-${{ github.run_id }}
      - name: Verify immutable promotion input
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.image_digest }}
          RELEASE_ID: ${{ needs.evaluation.outputs.release_id }}
        run: |
          test "$(jq -r '.image_digest' release-provenance.json)" = "$EXPECTED_DIGEST"
          test "$(jq -r '.release.id' release-provenance.json)" = "$RELEASE_ID"
          case "$(jq -r '.image_reference' release-provenance.json)" in *@sha256:*) ;; *) exit 1 ;; esac
      - name: Request short-lived staging identity
        run: |
          response="$(curl --fail --silent \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agenthub-staging")"
          test "$(jq -r '.value | length > 100' <<< "$response")" = true
      - name: Record staging promotion
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          RELEASE_ID: ${{ needs.evaluation.outputs.release_id }}
        run: |
          jq -n \
            --arg release_id "$RELEASE_ID" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg idempotency_key "${GITHUB_RUN_ID}-staging" \
            '{release_id: $release_id, target: "staging", image_digest: $image_digest, idempotency_key: $idempotency_key}' \
            > staging-promotion.json
      - name: Upload staging receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-promotion-${{ github.run_id }}
          path: staging-promotion.json
          if-no-files-found: error
          retention-days: 90

  production:
    name: Promote same digest to production
    if: github.event_name == 'release' || inputs.promote_production
    needs: [build, evaluation, staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download staging receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-promotion-${{ github.run_id }}
      - name: Verify no production rebuild
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.image_digest }}
          RELEASE_ID: ${{ needs.evaluation.outputs.release_id }}
        run: |
          test "$(jq -r '.image_digest' staging-promotion.json)" = "$EXPECTED_DIGEST"
          test "$(jq -r '.release_id' staging-promotion.json)" = "$RELEASE_ID"
      - name: Request short-lived production identity
        run: |
          response="$(curl --fail --silent \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agenthub-production")"
          test "$(jq -r '.value | length > 100' <<< "$response")" = true
      - name: Record production promotion
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          RELEASE_ID: ${{ needs.evaluation.outputs.release_id }}
        run: |
          jq -n \
            --arg release_id "$RELEASE_ID" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg idempotency_key "${GITHUB_RUN_ID}-production" \
            '{release_id: $release_id, target: "production", image_digest: $image_digest, idempotency_key: $idempotency_key}' \
            > production-promotion.json
