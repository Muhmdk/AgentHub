services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agenthub
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub -d agenthub"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - agenthub-postgres:/var/lib/postgresql/data

volumes:
  agenthub-postgres:
