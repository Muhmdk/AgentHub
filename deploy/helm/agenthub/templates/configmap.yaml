apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agenthub.fullname" . }}-runtime
  labels:
    {{- include "agenthub.labels" . | nindent 4 }}
data:
  AGENTHUB_ENVIRONMENT: {{ .Values.runtime.environment | quote }}
  AGENTHUB_LOG_LEVEL: {{ .Values.runtime.logLevel | quote }}
  AGENTHUB_API_HOST: "0.0.0.0"
  AGENTHUB_API_PORT: {{ .Values.service.targetPort | quote }}
  AGENTHUB_POLICY_TIMEOUT_SECONDS: {{ .Values.runtime.policyTimeoutSeconds | quote }}
  {{- with .Values.runtime.policyEngineUrl }}
  AGENTHUB_POLICY_ENGINE_URL: {{ . | quote }}
  {{- end }}
  AGENTHUB_MODEL_PROVIDER: {{ .Values.runtime.modelProvider | quote }}
  AGENTHUB_MODEL_REQUESTS_PER_MINUTE: {{ .Values.runtime.modelRequestsPerMinute | quote }}
  AGENTHUB_MODEL_TOKENS_PER_MINUTE: {{ .Values.runtime.modelTokensPerMinute | quote }}
  AGENTHUB_MODEL_COST_PER_HOUR_USD: {{ .Values.runtime.modelCostPerHourUsd | quote }}
  AGENTHUB_MODEL_TIMEOUT_SECONDS: {{ .Values.runtime.modelTimeoutSeconds | quote }}
  AGENTHUB_MODEL_MAX_ATTEMPTS: {{ .Values.runtime.modelMaxAttempts | quote }}
  AGENTHUB_MODEL_RETRY_BACKOFF_SECONDS: {{ .Values.runtime.modelRetryBackoffSeconds | quote }}
  AGENTHUB_RETRIEVAL_PROVIDER: {{ .Values.runtime.retrievalProvider | quote }}
  AGENTHUB_AGENT_MAX_STEPS: {{ .Values.runtime.agentMaxSteps | quote }}
  AGENTHUB_TOOL_TIMEOUT_SECONDS: {{ .Values.runtime.toolTimeoutSeconds | quote }}
  AGENTHUB_AGENT_TIMEOUT_SECONDS: {{ .Values.runtime.agentTimeoutSeconds | quote }}
  AGENTHUB_RAG_TOP_K: {{ .Values.runtime.ragTopK | quote }}
  AGENTHUB_RAG_MINIMUM_SCORE: {{ .Values.runtime.ragMinimumScore | quote }}
  AGENTHUB_RETRIEVAL_TIMEOUT_SECONDS: {{ .Values.runtime.retrievalTimeoutSeconds | quote }}
  AGENTHUB_AZURE_REQUEST_TIMEOUT_SECONDS: {{ .Values.runtime.azureRequestTimeoutSeconds | quote }}
  AGENTHUB_DATABASE_AUTH_MODE: {{ .Values.database.authMode | quote }}
  AGENTHUB_AZURE_POSTGRES_TOKEN_SCOPE: {{ .Values.database.azureTokenScope | quote }}
  AGENTHUB_OTEL_ENABLED: {{ .Values.runtime.otelEnabled | quote }}
  AGENTHUB_OTEL_EXPORTER: {{ .Values.runtime.otelExporter | quote }}
  AGENTHUB_OTEL_ENDPOINT: {{ .Values.runtime.otelEndpoint | quote }}
  {{- with .Values.runtime.azureManagedIdentityClientId }}
  AGENTHUB_AZURE_MANAGED_IDENTITY_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.runtime.azureOpenAIEndpoint }}
  AGENTHUB_AZURE_OPENAI_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .Values.runtime.azureOpenAIDeployment }}
  AGENTHUB_AZURE_OPENAI_DEPLOYMENT: {{ . | quote }}
  {{- end }}
  AGENTHUB_AZURE_OPENAI_INPUT_COST_PER_MILLION: {{ .Values.runtime.azureOpenAIInputCostPerMillion | quote }}
  AGENTHUB_AZURE_OPENAI_OUTPUT_COST_PER_MILLION: {{ .Values.runtime.azureOpenAIOutputCostPerMillion | quote }}
  {{- with .Values.runtime.azureSearchEndpoint }}
  AGENTHUB_AZURE_SEARCH_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .Values.runtime.azureSearchIndexName }}
  AGENTHUB_AZURE_SEARCH_INDEX_NAME: {{ . | quote }}
  {{- end }}
