{{- if and .Values.migrations.enabled .Values.migrations.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agenthub.migrationServiceAccountName" . }}
  labels:
    {{- include "agenthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  {{- if or .Values.runtime.azureDatabaseBootstrapIdentityClientId .Values.migrations.serviceAccount.annotations }}
  annotations:
    {{- with .Values.runtime.azureDatabaseBootstrapIdentityClientId }}
    azure.workload.identity/client-id: {{ . | quote }}
    {{- end }}
    {{- with .Values.migrations.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.migrations.serviceAccount.automountToken }}
{{- end }}
