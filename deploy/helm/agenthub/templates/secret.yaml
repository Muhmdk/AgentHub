{{- if .Values.database.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agenthub.databaseSecretName" . }}
  labels:
    {{- include "agenthub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKey }}: {{ required "database.url is required when database.createSecret is true" .Values.database.url | quote }}
{{- end }}
