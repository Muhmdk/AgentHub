{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "agenthub.fullname" . }}-key-vault
  labels:
    {{- include "agenthub.labels" . | nindent 4 }}
spec:
  provider: azure
  {{- with .Values.keyVault.secretObjects }}
  secretObjects:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "runtime.azureManagedIdentityClientId is required when Key Vault CSI is enabled" .Values.runtime.azureManagedIdentityClientId | quote }}
    keyvaultName: {{ required "keyVault.name is required when Key Vault CSI is enabled" .Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId is required when Key Vault CSI is enabled" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.keyVault.objects }}
        - |
          objectName: {{ .objectName | quote }}
          objectType: {{ .objectType | default "secret" | quote }}
          {{- with .objectAlias }}
          objectAlias: {{ . | quote }}
          {{- end }}
        {{- end }}
{{- end }}
