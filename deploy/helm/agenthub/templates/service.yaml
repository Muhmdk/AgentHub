apiVersion: v1
kind: Service
metadata:
  name: {{ include "agenthub.fullname" . }}-gateway
  labels:
    {{- include "agenthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "agenthub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
