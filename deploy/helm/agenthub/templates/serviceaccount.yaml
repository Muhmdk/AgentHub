{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agenthub.serviceAccountName" . }}
  labels:
    {{- include "agenthub.labels" . | nindent 4 }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.runtime.azureManagedIdentityClientId .Values.serviceAccount.annotations }}
  annotations:
    {{- with .Values.runtime.azureManagedIdentityClientId }}
    azure.workload.identity/client-id: {{ . | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
