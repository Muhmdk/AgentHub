fullnameOverride: agenthub

runtime:
  environment: staging
  modelProvider: azure-openai
  retrievalProvider: azure-search
  otelEnabled: true
  otelEndpoint: http://otel-collector.agenthub.svc.cluster.local:4318

database:
  authMode: azure-workload-identity
  createSecret: false
  url: ""
  existingSecret: agenthub-runtime # pragma: allowlist secret
  secretKey: database-url # pragma: allowlist secret

migrations:
  enabled: true
  azurePrincipalBootstrap: true
  databaseUrl: ""
  appPrincipalName: ""
  appPrincipalObjectId: ""

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false

networkPolicy:
  enabled: true
  postgresCidrs:
    - 10.40.16.0/24

keyVault:
  enabled: true
  name: ""
  tenantId: ""
  objects:
    - objectName: database-url
      objectType: secret
  secretObjects:
    - secretName: agenthub-runtime # pragma: allowlist secret
      type: Opaque
      data:
        - objectName: database-url
          key: database-url
