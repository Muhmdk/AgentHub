nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: agenthub
  tag: 0.3.0-dev
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  automountToken: false
  annotations: {}
  labels: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

runtime:
  environment: local
  logLevel: INFO
  modelProvider: fake
  modelRequestsPerMinute: 120
  modelTokensPerMinute: 100000
  modelCostPerHourUsd: 10.0
  modelTimeoutSeconds: 10.0
  modelMaxAttempts: 2
  modelRetryBackoffSeconds: 0.05
  retrievalProvider: local
  agentMaxSteps: 3
  toolTimeoutSeconds: 1.0
  agentTimeoutSeconds: 5.0
  ragTopK: 3
  ragMinimumScore: 0.15
  retrievalTimeoutSeconds: 5.0
  azureRequestTimeoutSeconds: 10.0
  azureManagedIdentityClientId: ""
  azureDatabaseBootstrapIdentityClientId: ""
  azureOpenAIEndpoint: ""
  azureOpenAIDeployment: ""
  azureOpenAIInputCostPerMillion: 0.0
  azureOpenAIOutputCostPerMillion: 0.0
  azureSearchEndpoint: ""
  azureSearchIndexName: ""
  otelEnabled: false
  otelExporter: otlp
  otelEndpoint: http://otel-collector:4318
  azureMonitorConnectionStringSecretKey: azure-monitor-connection-string # pragma: allowlist secret
  gatewayServiceTokensSecretKey: gateway-service-tokens # pragma: allowlist secret
  policyEngineUrl: ""
  policyTimeoutSeconds: 2.0

policy:
  enabled: false
  image:
    repository: openpolicyagent/opa
    digest: sha256:94830e998dd9df8e49a61826f1ad03d8a68d3ecd52f105e06a2adb93b459ad46
    pullPolicy: IfNotPresent
  port: 8181
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

database:
  authMode: password
  azureTokenScope: https://ossrdbms-aad.database.windows.net/.default
  createSecret: true
  url: postgresql+psycopg://agenthub:agenthub@postgres:5432/agenthub # pragma: allowlist secret
  existingSecret: ""
  secretKey: database-url # pragma: allowlist secret

migrations:
  enabled: true
  azurePrincipalBootstrap: false
  databaseUrl: ""
  appPrincipalName: ""
  appPrincipalObjectId: ""
  backoffLimit: 3
  serviceAccount:
    create: true
    name: agenthub-database-bootstrap
    automountToken: false
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

podDisruptionBudget:
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: true
  postgresCidrs:
    - 0.0.0.0/0

keyVault:
  enabled: false
  name: ""
  tenantId: ""
  objects: []
  secretObjects: []
  mountPath: /mnt/secrets-store

terminationGracePeriodSeconds: 30
revisionHistoryLimit: 3

podAnnotations: {}
podLabels: {}

extraEnv: []
