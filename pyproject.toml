[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthub"
version = "0.2.0"
description = "Enterprise AgentOps and ModelOps control plane"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{ name = "Muhammad Khan" }]
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "langgraph>=1.0,<2",
  "opentelemetry-api>=1.42,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.42,<2",
  "opentelemetry-sdk>=1.42,<2",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "detect-secrets>=1.5,<2",
  "httpx2>=2.12,<3",
  "jsonschema>=4.25,<5",
  "mypy>=1.14,<2",
  "pip-audit>=2.8,<3",
  "pyyaml>=6.0,<7",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6.0,<7",
]

[tool.setuptools.packages.find]
include = ["agents*", "apps*", "packages*"]

[tool.setuptools.package-data]
"apps.web" = ["*.html"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=agents --cov=apps --cov=packages --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
testpaths = ["tests"]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
markers = [
  "unit: isolated domain or configuration test",
  "contract: HTTP or schema contract test",
  "integration: component integration test",
  "e2e: process-level end-to-end smoke test",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
